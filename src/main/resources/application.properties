
# ======== CONFIGURAÇÃO DO BANCO DE DADOS SQL SERVER ========

spring.datasource.url=${DB_URL:jdbc:h2:mem:farmaciadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ======== CONFIGURACAO DE AUTENTICACAO (JWT) ========
# IMPORTANTE: em producao, defina a variavel de ambiente JWT_SECRET com um valor
# longo e aleatorio (>= 32 caracteres). A aplicacao falha ao iniciar sem esse valor.
jwt.secret=${JWT_SECRET:minhaChaveSuperSecretaECompridaDeTrintaEDoisCaracteresOuMais}
# Tempo de expiracao do access token em milissegundos (padrao: 15 minutos)
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Tempo de expiracao do refresh token em milissegundos (padrao: 7 dias)
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=${JWT_ISSUER:farmacia-api}
jwt.audience=${JWT_AUDIENCE:farmacia-web}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.block-ms=${AUTH_LOGIN_BLOCK_MS:900000}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


